<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xmind</title>
    <script src="/static/common.js"></script>
    <style>
        html, body, #xmind-container {
            height: 100%;
            padding: 0;
            margin: 0;
            background: #f5f5f5;
        }
        .empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 16px;
        }
    </style>
</head>
<body>
<div id="xmind-container"></div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const resources = [
            {
                url: '/static/xmind-embed-viewer/1.2.0/umd/xmind-embed-viewer.js',
                cdn: 'https://www.jsdelivr.com/npm/xmind-embed-viewer/dist/umd/xmind-embed-viewer.js',
                type: 'js'
            }
        ];

        ResourceLoader.load(resources)
            .then(() => {
                load();
            })
            .catch(error => {
                console.error('资源加载失败:', error);
            });
    });

    function load(){
        const id = getUrlParam('id');
        const container = document.getElementById('xmind-container');

        if (!id) {
            container.innerHTML = '<div class="empty">缺少文件 ID</div>';
            return;
        }

        const viewer = new XMindEmbedViewer({
            el: '#xmind-container',
            region: 'cn',
            styles: {height: "100%", width: "100%"},
        });
        fetch(`/wopi/files/${id}/contents`)
            .then(response => {
                if (!response.ok) throw new Error('文件内容获取失败 (HTTP ' + response.status + ')');
                return response.arrayBuffer();
            })
            .then(file => viewer.load(file))
            .catch(error => {
                console.error('could not fetch file content', error);
                showError('xmind-container', error.message);
            });
    }
</script>
</body>
</html>
