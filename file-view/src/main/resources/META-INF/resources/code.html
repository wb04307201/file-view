<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>code</title>
    <script src="/static/common.js"></script>
    <style>
        html, body {
            height: 100%;
            padding: 0;
            margin: 0;
            background: #f5f5f5;
        }
        pre {
            margin: 0;
            padding: 20px;
            overflow: auto;
            height: 100%;
            box-sizing: border-box;
        }
        .empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 16px;
        }
    </style>
</head>
<body>
<div id="code-container">
    <pre><code id="code"></code></pre>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const resources = [
            {
                url: '/static/highlight/11.11.1/styles/default.min.css',
                cdn: 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/default.min.css',
                type: 'css'
            },
            {
                url: '/static/highlight/11.11.1/highlight.min.js',
                cdn: 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js',
                type: 'js'
            }
        ];

        ResourceLoader.load(resources)
            .then(() => {
                load();
            })
            .catch(error => {
                console.error('资源加载失败:', error);
            });
    });

    function load() {
        const id = getUrlParam('id');
        const container = document.getElementById('code-container');

        if (!id) {
            container.innerHTML = '<div class="empty">缺少文件 ID</div>';
            return;
        }

        injectDownloadButton(id);

        fetch(`/wopi/files/${id}/contents`)
            .then(response => {
                if (!response.ok) throw new Error('文件内容获取失败 (HTTP ' + response.status + ')');
                return response.text();
            })
            .then(text => {
                document.getElementById("code").textContent = text;
                hljs.highlightAll();
            })
            .catch(error => {
                console.error('could not fetch file content', error);
                showError('code-container', error.message);
            });
    }
</script>
</body>
</html>
