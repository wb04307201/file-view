<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>markdown</title>
    <script src="/static/common.js"></script>
    <style>
        html, body {
            height: 100%;
            padding: 0;
            margin: 0;
            background: #f5f5f5;
        }
        #content {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
            min-height: 100%;
        }
        .empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 16px;
        }
    </style>
</head>
<body>
<div id="content"></div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const resources = [
            {
                url: '/static/vditor/3.11.2/index.css',
                cdn: 'https://cdn.jsdelivr.net/npm/vditor/dist/index.min.css',
                type: 'css'
            },
            {
                url: '/static/vditor/3.11.2/index.min.js',
                cdn: 'https://cdn.jsdelivr.net/npm/vditor/dist/index.min.js',
                type: 'js'
            }
        ];

        ResourceLoader.load(resources)
            .then(() => {
                load();
            })
            .catch(error => {
                console.error('资源加载失败:', error);
            });
    });

    function load(){
        const id = getUrlParam('id');
        const container = document.getElementById('content');

        if (!id) {
            container.innerHTML = '<div class="empty">缺少文件 ID</div>';
            return;
        }

        fetch(`/wopi/files/${id}/contents`)
            .then(response => {
                if (!response.ok) throw new Error('文件内容获取失败 (HTTP ' + response.status + ')');
                return response.text();
            })
            .then(text => {
                Vditor.preview(document.getElementById('content'), text, {})
            })
            .catch(error => {
                console.error('could not fetch file content', error);
                showError('content', error.message);
            });
    }
</script>
</body>
</html>
