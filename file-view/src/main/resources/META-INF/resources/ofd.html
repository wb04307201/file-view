    <style>
        html, body {
            height: 100%;
            padding: 0;
            margin: 0;
            background: #525659;
        }
        #ofd-container {
            width: 100%;
            height: 100vh;
        }
        #ofd-container .xq-doc-viewer {
            width: 100%;
            height: 100%;
        }
        .loading-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #999;
            font-size: 16px;
        }
    </style>

<body>
<div id="ofd-container">
    <div class="loading-overlay">解析中...</div>
</div>
<script type="module">
    import { createViewer } from 'xq-doc-viewer';

    const id = getUrlParam('id');
    const container = document.getElementById('ofd-container');

    if (!id) {
        container.innerHTML = '<div class="loading-overlay">缺少文件 ID</div>';
    } else {
        try {
            const viewer = createViewer({
                target: '#ofd-container',
                file: `/wopi/files/${id}/contents`,
                type: 'ofd',
                locale: 'zh-CN',
                theme: 'light',
                toolbar: true,
                onReady() {
                    const loading = container.querySelector('.loading-overlay');
                    if (loading) loading.remove();
                },
                onError(err) {
                    console.error('OFD 加载失败:', err);
                    const msg = err?.message || String(err);
                    const loading = container.querySelector('.loading-overlay');
                    if (loading) {
                        loading.textContent = '加载失败: ' + msg;
                    } else {
                        container.innerHTML = '<div class="loading-overlay">加载失败: ' + escapeHtml(msg) + '</div>';
                    }
                }
            });
            await viewer.mount();
        } catch (error) {
            console.error('OFD 加载失败:', error);
            const msg = error?.message || String(error);
            const loading = container.querySelector('.loading-overlay');
            if (loading) {
                loading.textContent = '加载失败: ' + msg;
            } else {
                container.innerHTML = '<div class="loading-overlay">加载失败: ' + escapeHtml(msg) + '</div>';
            }
        }
    }
</script>
