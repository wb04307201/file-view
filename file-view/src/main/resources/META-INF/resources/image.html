<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image</title>
    <script src="/static/common.js"></script>
    <style>
        html, body {
            height: 100%;
            padding: 0;
            margin: 0;
            background: #1a1a1a;
        }
        #image-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 16px;
        }
    </style>
</head>
<body>
<div id="image-container">
    <img id="image" style="display: none">
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const resources = [
            {
                url: '/static/viewerjs/1.11.7/viewer.min.css',
                cdn: 'https://cdn.jsdelivr.net/npm/viewerjs/dist/viewer.min.css',
                type: 'css'
            },
            {
                url: '/static/viewerjs/1.11.7/viewer.min.js',
                cdn: 'https://cdn.jsdelivr.net/npm/viewerjs/dist/viewer.min.js',
                type: 'js'
            }
        ];

        ResourceLoader.load(resources)
            .then(() => {
                load();
            })
            .catch(error => {
                console.error('资源加载失败:', error);
            });
    });

    function load() {
        const image = document.getElementById('image');
        const container = document.getElementById('image-container');
        const id = getUrlParam('id');

        if (!id) {
            container.innerHTML = '<div class="empty">缺少文件 ID</div>';
            return;
        }

        fetch(`/wopi/files/${id}`)
            .then(response => response.json())
            .then(data => {
                image.alt = data.BaseFileName;
                image.src = `/wopi/files/${id}/contents`;
                image.onload = function () {
                    const viewer = new Viewer(image, {
                        inline: true,
                        toolbar: {
                            zoomIn: 4,
                            zoomOut: 4,
                            oneToOne: 4,
                            reset: 4,
                            rotateLeft: 4,
                            rotateRight: 4,
                            flipHorizontal: 4,
                            flipVertical: 4,
                        },
                        title: true,
                        movable: true,
                        zoomable: true,
                        rotatable: true,
                        scalable: true,
                        transition: true,
                        keyboard: true,
                    });
                };
            })
            .catch(error => {
                console.error('could not fetch file content', error);
                showError('image-container', error.message);
            });
    }
</script>
</body>
</html>
