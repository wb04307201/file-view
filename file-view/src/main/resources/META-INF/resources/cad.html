<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Preview</title>
    <style>
        html, body {
            height: 100%;
            padding: 0;
            margin: 0;
            background: #1a1a1a;
        }
        #cad-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        .empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 16px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ccc;
            font-size: 14px;
        }
    </style>
    <script src="/static/common.js"></script>
    <!-- cad-simple-viewer 1.7.3+ 的 ESM 使用无扩展名相对导入（'./dxf'、'./base/'），
     浏览器无法解析，jsdelivr 也不补全；esm.sh 会把这些依赖预打包并转译。
     1.7.3 起 DWG 解析器不再随包自动注册，必须先手动登记（见下方 registerDwgParser），
     否则 openDocument 对 .dwg 一律返回 false。 -->
<script type="importmap">
    {
        "imports": {
            "@mlightcad/cad-simple-viewer": "https://esm.sh/@mlightcad/cad-simple-viewer@1.7.3",
            "@mlightcad/libredwg-converter": "https://esm.sh/@mlightcad/libredwg-converter@3.15.1",
            "@mlightcad/data-model": "https://esm.sh/@mlightcad/data-model@1.15.1"
        }
    }
    </script>
</head>
<body>
<div id="cad-container">
    <div id="loading">加载中...</div>
</div>
<script type="module">
    import { AcApDocManager } from '@mlightcad/cad-simple-viewer';
    import { AcDbLibreDwgConverter } from '@mlightcad/libredwg-converter';
    import { AcDbDatabaseConverterManager, AcDbFileType } from '@mlightcad/data-model';

    const id = getUrlParam('id');
    const container = document.getElementById('cad-container');
    const loading = document.getElementById('loading');

    // 1.7.3 起 DWG 解析器不再随 createInstance 自动注册，DXF 仍自动注册。
    // 必须显式登记 DWG，否则 openDocument('.dwg') 直接返回 false。
    function registerDwgParser(workerUrl) {
        const converter = new AcDbLibreDwgConverter({
            convertByEntityType: false,
            useWorker: true,
            parserWorkerUrl: workerUrl
        });
        AcDbDatabaseConverterManager.instance.register(AcDbFileType.DWG, converter);
    }

    if (!id) {
        container.innerHTML = '<div class="empty">缺少文件 ID</div>';
    } else {
        load();
    }

    async function load() {
        injectDownloadButton(id);
        try {
            const fileResp = await fetch(`/wopi/files/${id}`);
            if (!fileResp.ok) throw new Error('文件信息获取失败 (HTTP ' + fileResp.status + ')');
            const file = await fileResp.json();

            const contentResp = await fetch(`/wopi/files/${id}/contents`);
            if (!contentResp.ok) throw new Error('文件内容获取失败 (HTTP ' + contentResp.status + ')');
            const arrayBuffer = await contentResp.arrayBuffer();

            const dwgParserUrl = '/static/cad-workers/libredwg-parser-worker.js';
            registerDwgParser(dwgParserUrl);

            await AcApDocManager.createInstance({
                container: container,
                autoResize: true,
                useMainThreadDraw: true,
                webworkerFileUrls: {
                    dxfParser: '/static/cad-workers/dxf-parser-worker.js',
                    dwgParser: dwgParserUrl,
                    mtextRender: '/static/cad-workers/mtext-renderer-worker.js'
                }
            });

            const success = await AcApDocManager.instance.openDocument(file.BaseFileName, arrayBuffer, {
                minimumChunkSize: 1000,
                readOnly: true
            });
            if (!success) {
                throw new Error('文档打开失败');
            }

            await AcApDocManager.instance.loadDefaultFonts();

            loading.remove();

        } catch (error) {
            console.error('CAD 加载失败:', error);
            container.innerHTML = '<div class="empty">加载失败: ' + escapeHtml(error.message) + '</div>';
        }
    }
</script>
</body>
</html>
